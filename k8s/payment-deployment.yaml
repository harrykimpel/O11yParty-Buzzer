apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: otel-demo
  labels:
    app: payment
    app.kubernetes.io/name: payment
    app.kubernetes.io/component: payment
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        app.kubernetes.io/name: payment
        app.kubernetes.io/component: payment
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: payment
          image: ghcr.io/open-telemetry/demo:latest-paymentservice
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
          env:
            - name: PAYMENT_SERVICE_PORT
              value: "8080"
            - name: OTEL_SERVICE_NAME
              value: payment
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=payment,service.namespace=otel-demo"
          # Readiness probe: gRPC health check on port 8080
          # Pod is only added to Service endpoints when this passes,
          # preventing "produced zero addresses" DNS failures.
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 5
          # Liveness probe: restarts container if health check fails repeatedly
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 5
          # Startup probe: gives the container time to start before liveness kicks in
          startupProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
