# NetworkPolicy: allow checkout → payment gRPC traffic
#
# Restricts ingress to the payment service to only pods that carry the
# "app: checkout" label. All other ingress is denied by default once any
# NetworkPolicy selects the payment pod, so this policy is both permissive
# for the expected caller and restrictive for everything else.
#
# Apply with:
#   kubectl apply -f k8s/payment-service/network-policy.yaml -n otel-demo
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-checkout-to-payment
  namespace: otel-demo
  labels:
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  # This policy governs ingress to the payment pods.
  podSelector:
    matchLabels:
      app: payment
  policyTypes:
    - Ingress
  ingress:
    # Allow gRPC traffic from the checkout service on port 50051.
    - from:
        - podSelector:
            matchLabels:
              app: checkout
      ports:
        - protocol: TCP
          port: 50051
