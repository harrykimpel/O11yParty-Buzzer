# Payment Service Kubernetes Service for OpenTelemetry Demo (Astroshop)
#
# Resolves: DNS name "paymentservice" must resolve to a ClusterIP with healthy endpoints.
# The checkout service connects via gRPC to "paymentservice:50051" (or the FQDN
# "paymentservice.otel-demo.svc.cluster.local:50051"). If this Service object is
# absent or its selector matches no Running pods, CoreDNS returns zero A records,
# which surfaces as the observed "name resolver error: produced zero addresses".
#
# Apply with:
#   kubectl apply -f k8s/payment-service/service.yaml -n otel-demo
#
# Verify endpoints after applying:
#   kubectl get endpoints paymentservice -n otel-demo
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: otel-demo
  labels:
    app: payment
    app.kubernetes.io/name: paymentservice
    app.kubernetes.io/component: payment-service
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  # ClusterIP is the correct type for in-cluster gRPC service-to-service calls.
  # The selector MUST match the labels on the payment Deployment's pod template.
  type: ClusterIP
  selector:
    app: payment
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
