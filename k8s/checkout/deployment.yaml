apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: otel-demo
  labels:
    app: checkout
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: astroshop
  annotations:
    # Document the retry/circuit-breaker strategy applied to outbound gRPC calls.
    resilience.policy/payment-service: "retry=3,backoff=exponential,circuit-breaker=enabled"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: astroshop
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: checkout
          image: ghcr.io/open-telemetry/demo/checkout:latest
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
          env:
            - name: CHECKOUT_SERVICE_PORT
              value: "8080"
            - name: PAYMENT_SERVICE_ADDR
              # Use the fully-qualified cluster DNS name to avoid short-name resolution
              # failures when the search domain list does not include otel-demo.svc.cluster.local.
              value: "payment.otel-demo.svc.cluster.local:8080"
            - name: CART_SERVICE_ADDR
              value: "cart.otel-demo.svc.cluster.local:8080"
            - name: CURRENCY_SERVICE_ADDR
              value: "currency.otel-demo.svc.cluster.local:8080"
            - name: PRODUCT_CATALOG_SERVICE_ADDR
              value: "productcatalog.otel-demo.svc.cluster.local:3550"
            - name: SHIPPING_SERVICE_ADDR
              value: "shipping.otel-demo.svc.cluster.local:50051"
            - name: OTEL_SERVICE_NAME
              value: "checkout"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            # gRPC keepalive: ensure idle connections are detected as broken before the
            # next real RPC, rather than learning the connection is dead mid-request.
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_KEEPALIVE_TIME_MS
              value: "30000"
            - name: GRPC_KEEPALIVE_TIMEOUT_MS
              value: "10000"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          startupProbe:
            grpc:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
